<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1050" viewBox="0 0 750 1050">
  <defs>
    <linearGradient id="card" x1="70" y1="30" x2="690" y2="1020" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211546"/>
      <stop offset="0.48" stop-color="#4B1E62"/>
      <stop offset="1" stop-color="#10122E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="43%" r="55%">
      <stop stop-color="#E89AA9" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#9C4FA2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#130F2C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rose" x1="250" y1="340" x2="505" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0C7"/>
      <stop offset=".25" stop-color="#E8B487"/>
      <stop offset=".58" stop-color="#C87983"/>
      <stop offset="1" stop-color="#7A3C77"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="280" y1="365" x2="465" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C398"/>
      <stop offset="1" stop-color="#A24D87"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="475" y1="390" x2="285" y2="655" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFA0B0"/>
      <stop offset="1" stop-color="#7E4EA0"/>
    </linearGradient>
    <pattern id="mesh" width="78" height="78" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H78V78H0Z" fill="none" stroke="#F5D5B4" stroke-opacity=".075" stroke-width="2"/>
      <circle cx="39" cy="39" r="5" fill="none" stroke="#F5D5B4" stroke-opacity=".09" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/>
      <feOffset dy="10"/>
      <feColorMatrix values="0 0 0 0 0.02 0 0 0 0 0.01 0 0 0 0 0.08 0 0 0 .55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inside"><rect x="27" y="27" width="696" height="996" rx="35"/></clipPath>
  </defs>

  <rect width="750" height="1050" rx="45" fill="#F7E8D2"/>
  <rect x="14" y="14" width="722" height="1022" rx="39" fill="url(#card)"/>
  <g clip-path="url(#inside)">
    <rect x="20" y="20" width="710" height="1010" fill="url(#glow)"/>
    <rect x="20" y="20" width="710" height="1010" fill="url(#mesh)"/>
    <path d="M-80 168C145 72 231 255 409 162S694 22 848 112" fill="none" stroke="#E7A2B2" stroke-opacity=".16" stroke-width="38"/>
    <path d="M-91 883C135 979 241 798 416 891S704 1032 852 941" fill="none" stroke="#A064AC" stroke-opacity=".15" stroke-width="38"/>
  </g>

  <rect x="34" y="34" width="682" height="982" rx="30" fill="none" stroke="url(#rose)" stroke-width="5"/>
  <rect x="53" y="53" width="644" height="944" rx="23" fill="none" stroke="#F4D4B2" stroke-opacity=".44" stroke-width="2"/>
  <path d="M80 116H214M536 116H670M80 934H214M536 934H670" stroke="#F0C5A0" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="375" cy="116" r="5" fill="#F2D1B0"/><circle cx="375" cy="934" r="5" fill="#F2D1B0"/>

  <g filter="url(#shadow)">
    <circle cx="375" cy="500" r="174" fill="#171437" fill-opacity=".72" stroke="url(#rose)" stroke-width="4"/>
    <circle cx="375" cy="500" r="155" fill="none" stroke="#F4D4B2" stroke-opacity=".28" stroke-width="2"/>
    <!-- Four interlocking resort-light ribbons; rotationally balanced for a card back. -->
    <path d="M375 354C424 354 474 396 474 447C474 486 448 519 411 532C427 503 421 470 397 448C375 428 344 424 316 435C329 388 347 354 375 354Z" fill="url(#ribbonA)"/>
    <path d="M521 500C521 549 479 599 428 599C389 599 356 573 343 536C372 552 405 546 427 522C447 500 451 469 440 441C487 454 521 472 521 500Z" fill="url(#ribbonB)"/>
    <path d="M375 646C326 646 276 604 276 553C276 514 302 481 339 468C323 497 329 530 353 552C375 572 406 576 434 565C421 612 403 646 375 646Z" fill="url(#ribbonA)"/>
    <path d="M229 500C229 451 271 401 322 401C361 401 394 427 407 464C378 448 345 454 323 478C303 500 299 531 310 559C263 546 229 528 229 500Z" fill="url(#ribbonB)"/>
    <circle cx="375" cy="500" r="23" fill="#F7DFC0"/>
    <circle cx="375" cy="500" r="11" fill="#8B4A88"/>
  </g>

  <text x="375" y="730" fill="#FFF1D7" font-family="Montserrat, Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="14" text-anchor="middle">INSPIRE</text>
  <text x="375" y="772" fill="#E6B994" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="7" text-anchor="middle">ENTERTAINMENT RESORT</text>
  <path d="M248 804H502" stroke="#E6B994" stroke-opacity=".62" stroke-width="2"/>
</svg>
