<title>바카라 스퀴즈 프로토타입</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0912; }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  .page { display:flex; flex-direction:column; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#eee; }
  header { padding:10px 14px 6px; text-align:center; }
  header h1 { font-size:14px; margin:0 0 4px; color:#D8B15C; font-weight:600; }
  header p { font-size:11.5px; color:#9a97ab; margin:0; }
  .stage { flex:1; position:relative; margin:6px 10px; border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  footer { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 14px 14px; flex-wrap:wrap; }
  #edgeReadout { font-family:'SFMono-Regular',Consolas,monospace; font-size:11px; color:#D8B15C; white-space:pre; }
  .btn { font-family:inherit; font-size:12px; background:transparent; border:1px solid #3a3550; color:#cfc9e6; border-radius:999px; padding:7px 14px; }
  .btn:active { background:rgba(216,177,92,0.15); }
  .btn.on { border-color:#D8B15C; color:#D8B15C; }
</style>

<div class="page">
  <header>
    <h1>바카라 스퀴즈 프로토타입 — 오른쪽 긴 변 (v2)</h1>
    <p>오른쪽 가장자리 48px 이내에서만 시작 · 실제 반사 기하 검증용</p>
  </header>
  <div class="stage">
    <canvas id="cardCanvas"></canvas>
  </div>
  <footer>
    <span id="edgeReadout">대기 중</span>
    <span style="flex:1"></span>
    <button class="btn on" id="debugBtn" type="button">디버그 ON</button>
    <button class="btn" id="resetBtn" type="button">다시 덮기</button>
  </footer>
</div>

<script>
(function () {
  var canvas = document.getElementById('cardCanvas');
  var ctx = canvas.getContext('2d');
  var resetBtn = document.getElementById('resetBtn');
  var debugBtn = document.getElementById('debugBtn');
  var edgeReadout = document.getElementById('edgeReadout');

  var W = 0, H = 0, dpr = Math.max(1, window.devicePixelRatio || 1);
  var DEBUG = true;

  var TW = 480, TH = 800;
  var backTex = document.createElement('canvas');
  backTex.width = TW; backTex.height = TH;
  var frontTex = document.createElement('canvas');
  frontTex.width = TW; frontTex.height = TH;

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawBack(c, w, h) {
    var g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#241a3d');
    g.addColorStop(1, '#0c0a15');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    var rg = c.createRadialGradient(w * 0.5, h * 0.42, 10, w * 0.5, h * 0.42, w * 0.65);
    rg.addColorStop(0, 'rgba(216,177,92,0.30)');
    rg.addColorStop(1, 'rgba(216,177,92,0)');
    c.fillStyle = rg; c.fillRect(0, 0, w, h);
    var lw = Math.max(4, w * 0.02);
    c.strokeStyle = '#D8B15C'; c.lineWidth = lw;
    c.strokeRect(lw / 2, lw / 2, w - lw, h - lw);
    var inset = w * 0.05;
    c.strokeStyle = 'rgba(216,177,92,0.5)'; c.lineWidth = 2;
    c.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
    c.save();
    c.beginPath(); c.rect(inset, inset, w - inset * 2, h - inset * 2); c.clip();
    c.strokeStyle = 'rgba(216,177,92,0.12)'; c.lineWidth = 1.5;
    var step = w * 0.055;
    for (var x = -h; x < w + h; x += step) {
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + h, h); c.stroke();
      c.beginPath(); c.moveTo(x, h); c.lineTo(x + h, 0); c.stroke();
    }
    c.restore();
    c.save();
    c.translate(w / 2, h * 0.42); c.rotate(Math.PI / 4);
    var sz = w * 0.17;
    var eg = c.createLinearGradient(-sz, -sz, sz, sz);
    eg.addColorStop(0, '#F3D98A'); eg.addColorStop(0.55, '#D8B15C'); eg.addColorStop(1, '#7A5A22');
    c.fillStyle = eg;
    roundRect(c, -sz / 2, -sz / 2, sz, sz, sz * 0.15); c.fill();
    c.restore();
  }

  function drawFront(c, w, h) {
    c.fillStyle = '#FBF9F4'; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(0,0,0,0.15)'; c.lineWidth = 3;
    c.strokeRect(1.5, 1.5, w - 3, h - 3);
    var red = '#B23B3B';
    c.fillStyle = red;
    c.font = '700 ' + (w * 0.075) + 'px Georgia, serif';
    c.textBaseline = 'top';
    c.fillText('9', w * 0.05, h * 0.022);
    c.font = (w * 0.058) + 'px Georgia, serif';
    c.fillText('♦', w * 0.055, h * 0.022 + w * 0.085);
    c.save();
    c.translate(w * 0.95, h * 0.978); c.rotate(Math.PI);
    c.font = '700 ' + (w * 0.075) + 'px Georgia, serif';
    c.fillText('9', 0, 0);
    c.font = (w * 0.058) + 'px Georgia, serif';
    c.fillText('♦', -w * 0.004, w * 0.085);
    c.restore();

    function pip(fx, fy) {
      var px = fx * w, py = fy * h, sz = w * 0.115;
      c.save();
      c.translate(px, py); c.rotate(Math.PI / 4);
      c.fillStyle = red;
      roundRect(c, -sz / 2, -sz / 2, sz, sz, sz * 0.16);
      c.fill();
      c.restore();
    }
    var xL = 0.305, xR = 0.695;
    var y1 = 0.195, y2 = 0.365, y3 = 0.635, y4 = 0.805;
    pip(xL, y1); pip(xR, y1);
    pip(xL, y2); pip(xR, y2);
    pip(0.5, 0.5);
    pip(xL, y3); pip(xR, y3);
    pip(xL, y4); pip(xR, y4);
  }

  drawBack(backTex.getContext('2d'), TW, TH);
  drawFront(frontTex.getContext('2d'), TW, TH);

  // ---------------------------------------------------------------
  // Geometry constants
  // ---------------------------------------------------------------
  var START_ZONE_PX = 48;   // only the right 48px strip can start a squeeze
  var BUMP_WIDTH = 26;      // px of depth over which the crease rounds
  var BUMP_HEIGHT = 30;     // px of visual lift at the crease's peak
  var FULL_REVEAL_DEPTH_FRAC = 0.62; // fraction of card width to trigger full reveal on release

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  var state = {
    dragging: false,
    revealed: false,
    everTouched: false,
    F0: null,        // the exact point first touched (world coords)
    pointer: null,    // raw current pointer position
    target: null,     // release animation target { x, y, full }
  };

  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function pointerLocal(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function onDown(e) {
    if (state.revealed) return;
    var p = pointerLocal(e);
    if ((W - p.x) > START_ZONE_PX) return; // outside the right-edge start zone: ignore
    state.dragging = true;
    state.target = null;
    state.everTouched = true;
    state.F0 = { x: p.x, y: p.y };   // the exact grabbed point — no snapping to the edge line
    state.pointer = { x: p.x, y: p.y };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!state.dragging) return;
    var p = pointerLocal(e);
    state.pointer = {
      x: Math.max(-W * 0.5, Math.min(W * 1.2, p.x)),
      y: Math.max(-H * 0.5, Math.min(H * 1.2, p.y))
    };
  }
  function onUp() {
    if (!state.dragging) return;
    state.dragging = false;
    var geo = computeGeometry();
    if (!geo) { state.target = { x: state.F0.x, y: state.F0.y, full: false }; return; }
    if (geo.depthF0 > W * FULL_REVEAL_DEPTH_FRAC) {
      // Continue in the same direction the user was already dragging, off-screen.
      var dirLen = Math.hypot(geo.n.x, geo.n.y) || 1;
      var ux = geo.n.x / dirLen, uy = geo.n.y / dirLen;
      var throwDist = Math.hypot(W, H) * 1.5;
      state.target = { x: state.F0.x + ux * throwDist, y: state.F0.y + uy * throwDist, full: true };
      vibrate(28);
    } else {
      state.target = { x: state.F0.x, y: state.F0.y, full: false };
      vibrate(10);
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  resetBtn.addEventListener('click', function () {
    state.revealed = false; state.dragging = false; state.target = null;
    state.F0 = null; state.pointer = null;
  });
  debugBtn.addEventListener('click', function () {
    DEBUG = !DEBUG;
    debugBtn.classList.toggle('on', DEBUG);
    debugBtn.textContent = DEBUG ? '디버그 ON' : '디버그 OFF';
  });

  // ---------------------------------------------------------------
  // Polygon clipping (Sutherland–Hodgman, single half-plane)
  // ---------------------------------------------------------------
  function clipHalfPlane(poly, mx, my, nx, ny, keepPos) {
    var out = [], n = poly.length;
    if (n === 0) return out;
    for (var i = 0; i < n; i++) {
      var cur = poly[i], prev = poly[(i + n - 1) % n];
      var sCur = (cur.x - mx) * nx + (cur.y - my) * ny;
      var sPrev = (prev.x - mx) * nx + (prev.y - my) * ny;
      var curIn = keepPos ? sCur >= 0 : sCur < 0;
      var prevIn = keepPos ? sPrev >= 0 : sPrev < 0;
      if (curIn) {
        if (!prevIn) {
          var t = sPrev / (sPrev - sCur);
          out.push({ x: prev.x + (cur.x - prev.x) * t, y: prev.y + (cur.y - prev.y) * t });
        }
        out.push(cur);
      } else if (prevIn) {
        var t2 = sPrev / (sPrev - sCur);
        out.push({ x: prev.x + (cur.x - prev.x) * t2, y: prev.y + (cur.y - prev.y) * t2 });
      }
    }
    return out;
  }
  // Clip `subject` against every edge of the convex polygon `clip` (generalized S-H).
  function clipByConvex(subject, clip) {
    if (clip.length < 3) return [];
    var cx = 0, cy = 0;
    for (var i = 0; i < clip.length; i++) { cx += clip[i].x; cy += clip[i].y; }
    cx /= clip.length; cy /= clip.length;
    var result = subject;
    for (var e = 0; e < clip.length && result.length > 0; e++) {
      var p0 = clip[e], p1 = clip[(e + 1) % clip.length];
      var ex = p1.x - p0.x, ey = p1.y - p0.y;
      var nx = -ey, ny = ex;
      var len = Math.hypot(nx, ny) || 1;
      nx /= len; ny /= len;
      if ((cx - p0.x) * nx + (cy - p0.y) * ny < 0) { nx = -nx; ny = -ny; }
      result = clipHalfPlane(result, p0.x, p0.y, nx, ny, true);
    }
    return result;
  }

  function affine(dx0, dy0, dx1, dy1, dx2, dy2, u0, v0, u1, v1, u2, v2) {
    var den = u0 * (v1 - v2) + u1 * (v2 - v0) + u2 * (v0 - v1);
    if (Math.abs(den) < 1e-6) return null;
    var a = (dx0 * (v1 - v2) + dx1 * (v2 - v0) + dx2 * (v0 - v1)) / den;
    var b = (dy0 * (v1 - v2) + dy1 * (v2 - v0) + dy2 * (v0 - v1)) / den;
    var c = (dx0 * (u2 - u1) + dx1 * (u0 - u2) + dx2 * (u1 - u0)) / den;
    var d = (dy0 * (u2 - u1) + dy1 * (u0 - u2) + dy2 * (u1 - u0)) / den;
    var e = (dx0 * (u1 * v2 - u2 * v1) + dx1 * (u2 * v0 - u0 * v2) + dx2 * (u0 * v1 - u1 * v0)) / den;
    var f = (dy0 * (u1 * v2 - u2 * v1) + dy1 * (u2 * v0 - u0 * v2) + dy2 * (u0 * v1 - u1 * v0)) / den;
    return [a, b, c, d, e, f];
  }
  function drawTri(tex, sx0, sy0, sx1, sy1, sx2, sy2, dx0, dy0, dx1, dy1, dx2, dy2, tint) {
    var m = affine(dx0, dy0, dx1, dy1, dx2, dy2, sx0, sy0, sx1, sy1, sx2, sy2);
    if (!m) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(dx0, dy0); ctx.lineTo(dx1, dy1); ctx.lineTo(dx2, dy2); ctx.closePath();
    ctx.clip();
    ctx.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
    ctx.drawImage(tex, 0, 0);
    ctx.restore();
    if (tint) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(dx0, dy0); ctx.lineTo(dx1, dy1); ctx.lineTo(dx2, dy2); ctx.closePath();
      ctx.fillStyle = tint;
      ctx.fill();
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------
  // Fold geometry for the current gesture. Returns null if there is
  // no fold to show (not dragging / dragging but depth <= 0).
  // ---------------------------------------------------------------
  function computeGeometry() {
    if (!state.F0 || !state.pointer) return null;
    var F0 = state.F0;
    // Depth is the *normal* (rightward-edge-relative) component only —
    // vertical pointer motion must not add depth, only rotate the fold axis.
    var effX = Math.min(state.pointer.x, F0.x);
    var F = { x: effX, y: state.pointer.y };
    var depthF0 = F0.x - effX; // >= 0 by construction
    if (depthF0 < 0.5) return null;

    var dx = F.x - F0.x, dy = F.y - F0.y;
    var len = Math.hypot(dx, dy);
    if (len < 0.5) return null;
    var nx = dx / len, ny = dy / len;   // fold-normal direction, F0 -> F
    var tx = -ny, ty = nx;               // fold-axis (tangent) direction
    var mx = (F0.x + F.x) / 2, my = (F0.y + F.y) / 2;

    return { F0: F0, F: F, n: { x: nx, y: ny }, t: { x: tx, y: ty }, m: { x: mx, y: my }, depthF0: depthF0 };
  }

  // depth: distance from the fold line, in the flap. alongN: signed offset
  // from the fold line along +n. z: visual lift. alongN == depth always
  // (i.e. every flap point sits at its exact mirror-reflected position);
  // only z bumps up and back down to 0 in a narrow band near the crease,
  // so the reflection distance F0->F is exact (transform(F0) === F) while
  // still reading as a rounded fold rather than a flat wipe.
  function curl(depth) {
    if (depth >= BUMP_WIDTH) return { alongN: depth, z: 0, theta: Math.PI };
    var theta = (depth / BUMP_WIDTH) * Math.PI;
    var z = BUMP_HEIGHT * (1 - Math.cos(theta)) / 2;
    return { alongN: depth, z: z, theta: theta };
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    if (state.target) {
      state.pointer = state.pointer || { x: state.F0.x, y: state.F0.y };
      // Ease the *raw pointer* toward the target so computeGeometry() sees a shrinking/growing depth naturally.
      state.pointer.x += (state.target.x - state.pointer.x) * 0.22;
      state.pointer.y += (state.target.y - state.pointer.y) * 0.22;
      var settleDist = Math.hypot(state.target.x - state.pointer.x, state.target.y - state.pointer.y);
      if (settleDist < 2) {
        if (state.target.full) {
          state.revealed = true;
        } else {
          state.F0 = null; state.pointer = null;
        }
        state.target = null;
      }
    }

    if (state.revealed) {
      ctx.drawImage(frontTex, 0, 0, TW, TH, 0, 0, W, H);
      edgeReadout.textContent = '완전 공개';
      requestAnimationFrame(render);
      return;
    }

    var geo = computeGeometry();

    if (!geo) {
      ctx.drawImage(backTex, 0, 0, TW, TH, 0, 0, W, H);
      if (DEBUG) {
        ctx.save();
        ctx.strokeStyle = 'rgba(216,177,92,0.6)'; ctx.lineWidth = 2;
        ctx.strokeRect(W - START_ZONE_PX, 0, START_ZONE_PX, H);
        ctx.restore();
      }
      if (!state.everTouched) {
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.25 * Math.sin(performance.now() / 500);
        ctx.fillStyle = '#D8B15C';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('◀ 여기서 시작', W - START_ZONE_PX / 2, H / 2);
        ctx.restore();
      }
      edgeReadout.textContent = '대기 중';
      requestAnimationFrame(render);
      return;
    }

    var F0 = geo.F0, F = geo.F, nx = geo.n.x, ny = geo.n.y, tx = geo.t.x, ty = geo.t.y, mx = geo.m.x, my = geo.m.y;

    var rectPoly = [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H }];
    var bodyPoly = clipHalfPlane(rectPoly, mx, my, nx, ny, true);
    var flapPoly = clipHalfPlane(rectPoly, mx, my, nx, ny, false);

    if (bodyPoly.length >= 3) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(bodyPoly[0].x, bodyPoly[0].y);
      for (var bi = 1; bi < bodyPoly.length; bi++) ctx.lineTo(bodyPoly[bi].x, bodyPoly[bi].y);
      ctx.closePath(); ctx.clip();
      ctx.drawImage(backTex, 0, 0, TW, TH, 0, 0, W, H);
      ctx.restore();
    }

    var cx = W / 2, cy = H / 2, D = Math.max(W, H) * 2.6;
    function project(x, y, z) {
      var f = D / (D - z);
      return { x: cx + (x - cx) * f, y: cy + (y - cy) * f };
    }
    function vertexAt(px, py) {
      var vx = px - mx, vy = py - my;
      var depth = vx * (-nx) + vy * (-ny); // distance from fold line, >=0 inside flap
      var t = vx * tx + vy * ty;
      var cu = curl(Math.max(0, depth));
      var wx = mx + cu.alongN * nx + t * tx;
      var wy = my + cu.alongN * ny + t * ty;
      var scr = project(wx, wy, cu.z);
      return { sx: px, sy: py, dx: scr.x, dy: scr.y, z: cu.z, theta: cu.theta, depth: depth };
    }

    var maxZ = 0;
    var triCount = 0;
    if (flapPoly.length >= 3) {
      var dMax = 0, tMin = Infinity, tMax = -Infinity;
      for (var fi = 0; fi < flapPoly.length; fi++) {
        var pt = flapPoly[fi];
        var vx = pt.x - mx, vy = pt.y - my;
        var depth = vx * (-nx) + vy * (-ny);
        var t = vx * tx + vy * ty;
        if (depth > dMax) dMax = depth;
        if (t < tMin) tMin = t;
        if (t > tMax) tMax = t;
      }
      dMax = Math.max(dMax, 4);
      if (tMax - tMin < 2) { tMin -= 2; tMax += 2; }

      // Non-uniform depth levels: dense inside the bump, coarse beyond it
      // (the flat-reflected region needs no extra rows to look correct).
      var levels = [];
      var innerSteps = 10, outerSteps = 7;
      var innerMax = Math.min(dMax, BUMP_WIDTH * 1.6);
      for (var i = 0; i <= innerSteps; i++) levels.push(i / innerSteps * innerMax);
      if (dMax > innerMax) {
        for (var j = 1; j <= outerSteps; j++) levels.push(innerMax + j / outerSteps * (dMax - innerMax));
      }
      var TSEG = 8;
      var tStep = (tMax - tMin) / TSEG;

      var tris = [];
      for (var li = 0; li < levels.length - 1; li++) {
        var d0 = levels[li], d1 = levels[li + 1];
        for (var ti = 0; ti < TSEG; ti++) {
          var t0 = tMin + ti * tStep, t1 = tMin + (ti + 1) * tStep;
          var cellRest = [
            { x: mx - d0 * nx + t0 * tx, y: my - d0 * ny + t0 * ty },
            { x: mx - d1 * nx + t0 * tx, y: my - d1 * ny + t0 * ty },
            { x: mx - d1 * nx + t1 * tx, y: my - d1 * ny + t1 * ty },
            { x: mx - d0 * nx + t1 * tx, y: my - d0 * ny + t1 * ty }
          ];
          var clipped = clipByConvex(cellRest, flapPoly);
          if (clipped.length < 3) continue;
          for (var k = 1; k < clipped.length - 1; k++) {
            var a = vertexAt(clipped[0].x, clipped[0].y);
            var b = vertexAt(clipped[k].x, clipped[k].y);
            var c = vertexAt(clipped[k + 1].x, clipped[k + 1].y);
            tris.push({ a: a, b: b, c: c, z: (a.z + b.z + c.z) / 3, theta: (a.theta + b.theta + c.theta) / 3 });
          }
        }
      }
      tris.sort(function (p, q) { return p.z - q.z; });
      triCount = tris.length;

      // Soft contact shadow under the lifted crease, drawn before the mesh.
      var peak = tris.length ? tris[tris.length - 1] : null;
      for (var pz = 0; pz < tris.length; pz++) if (tris[pz].z > maxZ) maxZ = tris[pz].z;
      if (maxZ > 1 && peak) {
        var shR = Math.max(30, maxZ * 3.2);
        var grad = ctx.createRadialGradient(peak.a.dx, peak.a.dy + shR * 0.25, 2, peak.a.dx, peak.a.dy + shR * 0.25, shR);
        grad.addColorStop(0, 'rgba(0,0,0,0.30)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.ellipse(peak.a.dx, peak.a.dy + shR * 0.25, shR, shR * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      }

      for (var qi = 0; qi < tris.length; qi++) {
        var tri = tris[qi];
        // theta: 0 at the crease, PI once fully past the bump. Every point
        // with depth>0 is already at its true reflected (x,y); theta only
        // drives the cosmetic edge-shading blend below, not the texture pick.
        drawTri(frontTex,
          tri.a.sx / W * TW, tri.a.sy / H * TH,
          tri.b.sx / W * TW, tri.b.sy / H * TH,
          tri.c.sx / W * TW, tri.c.sy / H * TH,
          tri.a.dx, tri.a.dy, tri.b.dx, tri.b.dy, tri.c.dx, tri.c.dy, null);
        // Edge-on shading: darkest where the local bump slope is steepest
        // (~mid-crease), simulating the card's thickness at that angle.
        var slopeCue = Math.sin(tri.theta); // 0 at both ends of the bump, 1 at the middle
        if (slopeCue > 0.05) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(tri.a.dx, tri.a.dy); ctx.lineTo(tri.b.dx, tri.b.dy); ctx.lineTo(tri.c.dx, tri.c.dy); ctx.closePath();
          ctx.fillStyle = 'rgba(10,8,14,' + (0.34 * slopeCue) + ')';
          ctx.fill();
          ctx.fillStyle = 'rgba(255,240,210,' + (0.16 * slopeCue) + ')';
          ctx.fill();
          ctx.restore();
        }
        if (DEBUG) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(tri.a.dx, tri.a.dy); ctx.lineTo(tri.b.dx, tri.b.dy); ctx.lineTo(tri.c.dx, tri.c.dy); ctx.closePath();
          ctx.strokeStyle = 'rgba(0,255,180,0.35)'; ctx.lineWidth = 0.5;
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    // ---- grab-tracking correctness check ----
    var reflected = null, grabError = null;
    if (geo) {
      var v0 = vertexAt(F0.x, F0.y);
      reflected = { x: v0.dx, y: v0.dy };
      grabError = Math.hypot(reflected.x - F.x, reflected.y - F.y);
    }

    if (DEBUG) {
      ctx.save();
      // flapPoly outline
      if (flapPoly.length >= 3) {
        ctx.beginPath();
        ctx.moveTo(flapPoly[0].x, flapPoly[0].y);
        for (var fp = 1; fp < flapPoly.length; fp++) ctx.lineTo(flapPoly[fp].x, flapPoly[fp].y);
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255,80,80,0.85)'; ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // fold axis line through m
      ctx.beginPath();
      ctx.moveTo(mx - tx * 400, my - ty * 400);
      ctx.lineTo(mx + tx * 400, my + ty * 400);
      ctx.strokeStyle = 'rgba(120,200,255,0.6)'; ctx.lineWidth = 1;
      ctx.stroke();
      // F0 (yellow), F (magenta), transformed grab point (cyan ring)
      function dot(p, color, r) {
        ctx.beginPath(); ctx.arc(p.x, p.y, r || 5, 0, Math.PI * 2);
        ctx.fillStyle = color; ctx.fill();
      }
      dot(F0, '#ffd23f', 5);
      dot(F, '#ff3fd2', 5);
      if (reflected) {
        ctx.beginPath(); ctx.arc(reflected.x, reflected.y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#3ffff0'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();
    }

    var pct = Math.round(Math.min(1, geo.depthF0 / (W * FULL_REVEAL_DEPTH_FRAC)) * 100);
    var lines = [
      '깊이 ' + Math.round(geo.depthF0) + 'px (' + pct + '%)',
      'grabError ' + (grabError !== null ? grabError.toFixed(2) : '-') + 'px',
      '삼각형 ' + triCount + '개'
    ];
    edgeReadout.textContent = lines.join('\n');

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
