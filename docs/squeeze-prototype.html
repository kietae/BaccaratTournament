<title>바카라 스퀴즈 프로토타입</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0912; }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  .page { display:flex; flex-direction:column; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#eee; }
  header { padding:10px 14px 6px; text-align:center; }
  header h1 { font-size:14px; margin:0 0 4px; color:#D8B15C; font-weight:600; }
  header p { font-size:11.5px; color:#9a97ab; margin:0; }
  .stage { flex:1; position:relative; margin:6px 10px; border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px 16px; }
  #edgeReadout { font-family:'SFMono-Regular',Consolas,monospace; font-size:12px; color:#D8B15C; }
  #resetBtn { font-family:inherit; font-size:12.5px; background:transparent; border:1px solid #3a3550; color:#cfc9e6; border-radius:999px; padding:8px 16px; }
  #resetBtn:active { background:rgba(216,177,92,0.15); }
</style>

<div class="page">
  <header>
    <h1>바카라 스퀴즈 프로토타입</h1>
    <p>오른쪽 아래 모서리 근처를 눌러 안쪽으로 드래그 — 진짜로 접힙니다</p>
  </header>
  <div class="stage">
    <canvas id="cardCanvas"></canvas>
  </div>
  <footer>
    <span id="edgeReadout">대기 중</span>
    <button id="resetBtn" type="button">다시 덮기</button>
  </footer>
</div>

<script>
(function () {
  var canvas = document.getElementById('cardCanvas');
  var ctx = canvas.getContext('2d');
  var resetBtn = document.getElementById('resetBtn');
  var edgeReadout = document.getElementById('edgeReadout');

  var W = 0, H = 0, dpr = Math.max(1, window.devicePixelRatio || 1);

  var TW = 480, TH = 800;
  var backTex = document.createElement('canvas');
  backTex.width = TW; backTex.height = TH;
  var frontTex = document.createElement('canvas');
  frontTex.width = TW; frontTex.height = TH;

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawBack(c, w, h) {
    var g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#241a3d');
    g.addColorStop(1, '#0c0a15');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    var rg = c.createRadialGradient(w * 0.5, h * 0.42, 10, w * 0.5, h * 0.42, w * 0.65);
    rg.addColorStop(0, 'rgba(216,177,92,0.30)');
    rg.addColorStop(1, 'rgba(216,177,92,0)');
    c.fillStyle = rg; c.fillRect(0, 0, w, h);
    var lw = Math.max(4, w * 0.02);
    c.strokeStyle = '#D8B15C'; c.lineWidth = lw;
    c.strokeRect(lw / 2, lw / 2, w - lw, h - lw);
    var inset = w * 0.05;
    c.strokeStyle = 'rgba(216,177,92,0.5)'; c.lineWidth = 2;
    c.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
    c.save();
    c.beginPath(); c.rect(inset, inset, w - inset * 2, h - inset * 2); c.clip();
    c.strokeStyle = 'rgba(216,177,92,0.12)'; c.lineWidth = 1.5;
    var step = w * 0.055;
    for (var x = -h; x < w + h; x += step) {
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + h, h); c.stroke();
      c.beginPath(); c.moveTo(x, h); c.lineTo(x + h, 0); c.stroke();
    }
    c.restore();
    c.save();
    c.translate(w / 2, h * 0.42); c.rotate(Math.PI / 4);
    var sz = w * 0.17;
    var eg = c.createLinearGradient(-sz, -sz, sz, sz);
    eg.addColorStop(0, '#F3D98A'); eg.addColorStop(0.55, '#D8B15C'); eg.addColorStop(1, '#7A5A22');
    c.fillStyle = eg;
    roundRect(c, -sz / 2, -sz / 2, sz, sz, sz * 0.15); c.fill();
    c.restore();
  }

  function drawFront(c, w, h) {
    c.fillStyle = '#FBF9F4'; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(0,0,0,0.15)'; c.lineWidth = 3;
    c.strokeRect(1.5, 1.5, w - 3, h - 3);
    var red = '#B23B3B';
    c.fillStyle = red;
    c.font = '700 ' + (w * 0.09) + 'px Georgia, serif';
    c.textBaseline = 'top';
    c.fillText('9', w * 0.06, h * 0.03);
    c.font = (w * 0.07) + 'px Georgia, serif';
    c.fillText('♦', w * 0.065, h * 0.03 + w * 0.10);
    c.save();
    c.translate(w * 0.94, h * 0.97); c.rotate(Math.PI);
    c.font = '700 ' + (w * 0.09) + 'px Georgia, serif';
    c.fillText('9', 0, 0);
    c.font = (w * 0.07) + 'px Georgia, serif';
    c.fillText('♦', -w * 0.005, w * 0.10);
    c.restore();
    c.font = (w * 0.34) + 'px Georgia, serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('♦', w / 2, h * 0.5);
    c.textAlign = 'left';
  }

  drawBack(backTex.getContext('2d'), TW, TH);
  drawFront(frontTex.getContext('2d'), TW, TH);

  var state = { dragging: false, revealed: false, F0: { x: 0, y: 0 }, F: { x: 0, y: 0 }, target: null, everTouched: false };
  var CURL_R = 44;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.F0 = { x: W, y: H };
    if (!state.dragging && !state.target && !state.revealed) state.F = { x: W, y: H };
  }
  window.addEventListener('resize', resize);
  resize();

  function pointerLocal(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function withinStartZone(x, y) {
    var r = Math.min(W, H) * 0.42;
    var dx = W - x, dy = H - y;
    return Math.sqrt(dx * dx + dy * dy) < r;
  }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function onDown(e) {
    if (state.revealed) return;
    var p = pointerLocal(e);
    if (!withinStartZone(p.x, p.y)) return;
    state.dragging = true; state.target = null; state.everTouched = true;
    state.F = { x: p.x, y: p.y };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!state.dragging) return;
    var p = pointerLocal(e);
    state.F = {
      x: Math.max(-W * 0.3, Math.min(W * 1.1, p.x)),
      y: Math.max(-H * 0.3, Math.min(H * 1.1, p.y))
    };
  }
  function onUp() {
    if (!state.dragging) return;
    state.dragging = false;
    var dx = state.F.x - state.F0.x, dy = state.F.y - state.F0.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var diag = Math.sqrt(W * W + H * H);
    if (dist > diag * 0.6) {
      state.target = { x: -W * 0.2, y: -H * 0.2, full: true };
      vibrate(28);
    } else {
      state.target = { x: state.F0.x, y: state.F0.y, full: false };
      vibrate(10);
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  resetBtn.addEventListener('click', function () {
    state.revealed = false; state.dragging = false; state.target = null;
    state.F = { x: state.F0.x, y: state.F0.y };
  });

  function clipPoly(poly, mx, my, nx, ny, keepPos) {
    var out = [], n = poly.length;
    for (var i = 0; i < n; i++) {
      var cur = poly[i], prev = poly[(i + n - 1) % n];
      var sCur = (cur.x - mx) * nx + (cur.y - my) * ny;
      var sPrev = (prev.x - mx) * nx + (prev.y - my) * ny;
      var curIn = keepPos ? sCur >= 0 : sCur < 0;
      var prevIn = keepPos ? sPrev >= 0 : sPrev < 0;
      if (curIn) {
        if (!prevIn) {
          var t = sPrev / (sPrev - sCur);
          out.push({ x: prev.x + (cur.x - prev.x) * t, y: prev.y + (cur.y - prev.y) * t });
        }
        out.push(cur);
      } else if (prevIn) {
        var t2 = sPrev / (sPrev - sCur);
        out.push({ x: prev.x + (cur.x - prev.x) * t2, y: prev.y + (cur.y - prev.y) * t2 });
      }
    }
    return out;
  }

  function affine(dx0, dy0, dx1, dy1, dx2, dy2, u0, v0, u1, v1, u2, v2) {
    var den = u0 * (v1 - v2) + u1 * (v2 - v0) + u2 * (v0 - v1);
    if (Math.abs(den) < 1e-6) return null;
    var a = (dx0 * (v1 - v2) + dx1 * (v2 - v0) + dx2 * (v0 - v1)) / den;
    var b = (dy0 * (v1 - v2) + dy1 * (v2 - v0) + dy2 * (v0 - v1)) / den;
    var c = (dx0 * (u2 - u1) + dx1 * (u0 - u2) + dx2 * (u1 - u0)) / den;
    var d = (dy0 * (u2 - u1) + dy1 * (u0 - u2) + dy2 * (u1 - u0)) / den;
    var e = (dx0 * (u1 * v2 - u2 * v1) + dx1 * (u2 * v0 - u0 * v2) + dx2 * (u0 * v1 - u1 * v0)) / den;
    var f = (dy0 * (u1 * v2 - u2 * v1) + dy1 * (u2 * v0 - u0 * v2) + dy2 * (u0 * v1 - u1 * v0)) / den;
    return [a, b, c, d, e, f];
  }

  function drawTri(tex, sx0, sy0, sx1, sy1, sx2, sy2, dx0, dy0, dx1, dy1, dx2, dy2) {
    var m = affine(dx0, dy0, dx1, dy1, dx2, dy2, sx0, sy0, sx1, sy1, sx2, sy2);
    if (!m) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(dx0, dy0); ctx.lineTo(dx1, dy1); ctx.lineTo(dx2, dy2); ctx.closePath();
    ctx.clip();
    ctx.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
    ctx.drawImage(tex, 0, 0);
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    if (state.target) {
      state.F.x += (state.target.x - state.F.x) * 0.24;
      state.F.y += (state.target.y - state.F.y) * 0.24;
      var settleDist = Math.hypot(state.target.x - state.F.x, state.target.y - state.F.y);
      if (settleDist < 1.5) {
        if (state.target.full) state.revealed = true;
        state.F = { x: state.F0.x, y: state.F0.y };
        state.target = null;
      }
    }

    if (state.revealed) {
      ctx.drawImage(frontTex, 0, 0, TW, TH, 0, 0, W, H);
      edgeReadout.textContent = '완전 공개';
      requestAnimationFrame(render);
      return;
    }

    var F0 = state.F0, F = state.F;
    var dx = F.x - F0.x, dy = F.y - F0.y;
    var dragLen = Math.hypot(dx, dy);

    if (dragLen < 1) {
      ctx.drawImage(backTex, 0, 0, TW, TH, 0, 0, W, H);
      if (!state.everTouched) {
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.25 * Math.sin(performance.now() / 500);
        ctx.fillStyle = '#D8B15C';
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('◤', W - 22, H - 22);
        ctx.restore();
      }
      edgeReadout.textContent = '대기 중';
      requestAnimationFrame(render);
      return;
    }

    var nx = dx / dragLen, ny = dy / dragLen;
    var tx = -ny, ty = nx;
    var mx = (F0.x + F.x) / 2, my = (F0.y + F.y) / 2;

    var rectPoly = [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H }];
    var bodyPoly = clipPoly(rectPoly, mx, my, nx, ny, true);
    var flapPoly = clipPoly(rectPoly, mx, my, nx, ny, false);

    if (bodyPoly.length >= 3) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(bodyPoly[0].x, bodyPoly[0].y);
      for (var bi = 1; bi < bodyPoly.length; bi++) ctx.lineTo(bodyPoly[bi].x, bodyPoly[bi].y);
      ctx.closePath(); ctx.clip();
      ctx.drawImage(backTex, 0, 0, TW, TH, 0, 0, W, H);
      ctx.restore();
    }

    if (flapPoly.length >= 3) {
      var dMax = 0, tMin = Infinity, tMax = -Infinity;
      for (var fi = 0; fi < flapPoly.length; fi++) {
        var pt = flapPoly[fi];
        var s = (pt.x - mx) * nx + (pt.y - my) * ny;
        var d = -s;
        var t = (pt.x - mx) * tx + (pt.y - my) * ty;
        if (d > dMax) dMax = d;
        if (t < tMin) tMin = t;
        if (t > tMax) tMax = t;
      }
      dMax = Math.max(dMax, 4);
      if (tMax - tMin < 2) { tMin -= 2; tMax += 2; }

      var DSEG = 14, TSEG = 10;
      var dStep = dMax / DSEG, tStep = (tMax - tMin) / TSEG;

      function curl(d) {
        var phi = Math.min(d / CURL_R, 1) * Math.PI;
        return { alongN: -d * Math.cos(phi), z: CURL_R * Math.sin(phi) };
      }
      function worldAt(d, t) { return { x: mx - d * nx + t * tx, y: my - d * ny + t * ty }; }
      function curledAt(d, t) {
        var cu = curl(d);
        return { x: mx + cu.alongN * nx + t * tx, y: my + cu.alongN * ny + t * ty, z: cu.z };
      }

      var cx = W / 2, cy = H / 2, D = Math.max(W, H) * 2.6;
      function project(p) {
        var f = D / (D - p.z);
        return { x: cx + (p.x - cx) * f, y: cy + (p.y - cy) * f };
      }

      var pts = [];
      for (var di = 0; di <= DSEG; di++) {
        var row = [];
        var d0 = di * dStep;
        for (var ti = 0; ti <= TSEG; ti++) {
          var t0 = tMin + ti * tStep;
          var rest = worldAt(d0, t0);
          var ok = rest.x >= -2 && rest.x <= W + 2 && rest.y >= -2 && rest.y <= H + 2;
          var curled = curledAt(d0, t0);
          var screen = project(curled);
          row.push({ sx: rest.x, sy: rest.y, dx: screen.x, dy: screen.y, z: curled.z, ok: ok });
        }
        pts.push(row);
      }

      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.filter = 'blur(10px)';
      ctx.fillStyle = '#000';
      ctx.beginPath();
      var edgeRow = pts[DSEG];
      for (var ei = 0; ei <= TSEG; ei++) {
        var pe = edgeRow[ei];
        if (ei === 0) ctx.moveTo(pe.dx, pe.dy); else ctx.lineTo(pe.dx, pe.dy);
      }
      for (var ei2 = TSEG; ei2 >= 0; ei2--) {
        var pe2 = pts[0][ei2];
        ctx.lineTo(pe2.dx, pe2.dy);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();

      var tris = [];
      for (var di2 = 0; di2 < DSEG; di2++) {
        for (var ti2 = 0; ti2 < TSEG; ti2++) {
          var p00 = pts[di2][ti2], p10 = pts[di2 + 1][ti2], p01 = pts[di2][ti2 + 1], p11 = pts[di2 + 1][ti2 + 1];
          if (!(p00.ok || p10.ok || p01.ok || p11.ok)) continue;
          tris.push({ z: (p00.z + p10.z + p01.z) / 3, a: p00, b: p10, c: p01 });
          tris.push({ z: (p10.z + p11.z + p01.z) / 3, a: p10, b: p11, c: p01 });
        }
      }
      tris.sort(function (t1, t2) { return t1.z - t2.z; });
      for (var qi = 0; qi < tris.length; qi++) {
        var tri = tris[qi];
        drawTri(frontTex,
          tri.a.sx / W * TW, tri.a.sy / H * TH,
          tri.b.sx / W * TW, tri.b.sy / H * TH,
          tri.c.sx / W * TW, tri.c.sy / H * TH,
          tri.a.dx, tri.a.dy, tri.b.dx, tri.b.dy, tri.c.dx, tri.c.dy);
        var lt = Math.max(0, Math.min(1, tri.z / CURL_R));
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(tri.a.dx, tri.a.dy); ctx.lineTo(tri.b.dx, tri.b.dy); ctx.lineTo(tri.c.dx, tri.c.dy); ctx.closePath();
        ctx.fillStyle = 'rgba(255,240,210,' + (0.22 * lt) + ')';
        ctx.fill();
        ctx.restore();
      }
    }

    var pct = Math.round(Math.min(1, dragLen / (Math.hypot(W, H) * 0.6)) * 100);
    edgeReadout.textContent = '오른쪽 아래 · ' + pct + '%';

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
